[project]
name = "fastapi-task-api"
version = "0.1.0"
description = "Async task management API used by the FastAPI blog series"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "passlib[bcrypt]>=1.7,<2",
    "pydantic-settings>=2.7,<3",
    "PyJWT>=2.10,<3",
    "redis>=5.2,<6",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
