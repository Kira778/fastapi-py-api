services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task_api
      POSTGRES_USER: task_api
      POSTGRES_PASSWORD: task_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_api -d task_api"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: uv run celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
